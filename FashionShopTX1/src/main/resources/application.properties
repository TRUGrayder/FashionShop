# Server
server.port=8080

# MySQL Database (Mặc định XAMPP / MySQL port 3306, user root, không mật khẩu)
spring.datasource.url=jdbc:mysql://localhost:3306/fashion_shop?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.com.fashionshop=DEBUG
logging.level.org.springframework.jdbc=DEBUG
