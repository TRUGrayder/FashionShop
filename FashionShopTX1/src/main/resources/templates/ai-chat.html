<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Trợ lý AI Stylist - Fashion Shop')}">
</head>
<body style="background: #f8fafc; min-height: 100vh; display: flex; flex-direction: column;">

<!-- Navbar Fragment -->
<div th:replace="~{fragments/navbar :: navbar(activeTab='ai')}"></div>

<main class="container my-4 flex-grow-1 d-flex flex-column" style="max-width: 860px;">
    <!-- Chat Header Card -->
    <div class="card border-0 shadow-sm p-3 mb-3 bg-white rounded-4 d-flex flex-row align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-3">
            <div class="p-2 bg-danger-subtle text-danger rounded-circle fs-3 d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
                <i class="bi bi-robot"></i>
            </div>
            <div>
                <h5 class="fw-bold mb-0">Trợ Lý AI Stylist</h5>
                <small class="text-success"><i class="bi bi-circle-fill me-1" style="font-size: 0.5rem;"></i>Sẵn sàng tư vấn trực tuyến</small>
            </div>
        </div>
        <a href="/products" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
            <i class="bi bi-bag me-1"></i> Xem sản phẩm
        </a>
    </div>

    <!-- Chat Message Container -->
    <div class="card border-0 shadow-sm rounded-4 flex-grow-1 p-4 mb-3 bg-white d-flex flex-column" style="min-height: 400px; max-height: 550px; overflow-y: auto;" id="chatBox">
        <div class="d-flex gap-2 mb-3">
            <div class="p-2 bg-danger-subtle text-danger rounded-circle align-self-start" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;">
                <i class="bi bi-robot"></i>
            </div>
            <div class="p-3 rounded-4 bg-light text-dark" style="max-width: 80%; border-bottom-left-radius: 4px;">
                <div class="fw-bold small mb-1 text-danger">AI Stylist</div>
                <div>Xin chào! Em là trợ lý thời trang Fashion Shop. Em có thể gợi ý phối đồ, tư vấn trang phục theo dịp (đi làm, dạo phố, dự tiệc) hoặc gợi ý theo màu sắc bạn thích. Bạn đang tìm trang phục như thế nào?</div>
            </div>
        </div>
    </div>

    <!-- Chat Input Form -->
    <form id="chatForm" class="d-flex gap-2">
        <input type="text" id="messageInput" class="form-control form-control-lg rounded-pill shadow-sm ps-4"
               placeholder="Nhập câu hỏi (Ví dụ: Đi phỏng vấn công sở nên mặc gì?)..." autocomplete="off" required>
        <button type="submit" class="btn btn-accent btn-lg px-4 rounded-pill shadow-sm d-flex align-items-center justify-content-center">
            <i class="bi bi-send-fill"></i>
        </button>
    </form>
</main>

<!-- Footer Fragment -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script>
const chatBox = document.getElementById('chatBox');
const form = document.getElementById('chatForm');
const input = document.getElementById('messageInput');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = input.value.trim();
    if (!msg) return;

    // Tin nhắn của User
    chatBox.innerHTML += `
        <div class="d-flex justify-content-end mb-3">
            <div class="p-3 rounded-4 bg-danger text-white shadow-sm" style="max-width: 80%; border-bottom-right-radius: 4px;">
                ${msg}
            </div>
        </div>
    `;
    input.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    // Trạng thái AI đang suy nghĩ
    const typing = document.createElement('div');
    typing.id = 'typingIndicator';
    typing.className = 'd-flex gap-2 mb-3';
    typing.innerHTML = `
        <div class="p-2 bg-danger-subtle text-danger rounded-circle align-self-start" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;">
            <i class="bi bi-robot"></i>
        </div>
        <div class="p-3 rounded-4 bg-light text-muted fst-italic" style="border-bottom-left-radius: 4px;">
            AI đang phân tích và tìm câu trả lời...
        </div>
    `;
    chatBox.appendChild(typing);
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        const res = await fetch('/ai/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'message=' + encodeURIComponent(msg)
        });
        const data = await res.json();
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.remove();

        chatBox.innerHTML += `
            <div class="d-flex gap-2 mb-3">
                <div class="p-2 bg-danger-subtle text-danger rounded-circle align-self-start" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-robot"></i>
                </div>
                <div class="p-3 rounded-4 bg-light text-dark shadow-sm" style="max-width: 80%; border-bottom-left-radius: 4px;">
                    <div class="fw-bold small mb-1 text-danger">AI Stylist</div>
                    <div>${data.answer}</div>
                </div>
            </div>
        `;
    } catch (err) {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.remove();

        chatBox.innerHTML += `
            <div class="d-flex gap-2 mb-3">
                <div class="p-2 bg-danger-subtle text-danger rounded-circle align-self-start" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-robot"></i>
                </div>
                <div class="p-3 rounded-4 bg-light text-danger" style="border-bottom-left-radius: 4px;">
                    Xin lỗi, có lỗi kết nối với máy chủ AI. Bạn vui lòng thử lại nhé!
                </div>
            </div>
        `;
    }
    chatBox.scrollTop = chatBox.scrollHeight;
});
</script>

</body>
</html>
