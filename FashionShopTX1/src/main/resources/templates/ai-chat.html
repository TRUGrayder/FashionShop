<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ lý AI - Fashion Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --primary: #0f0f1a; --accent: #e94560; }
        body { background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: var(--primary) !important; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
        .message { max-width: 75%; margin-bottom: 16px; padding: 12px 18px; border-radius: 18px; line-height: 1.5; }
        .message.bot { background: white; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        .message.user { background: var(--accent); color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .chat-input { background: white; border-top: 1px solid #eee; padding: 16px; }
        .btn-accent { background: var(--accent); color: #fff; border: none; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-bag-heart-fill me-2"></i>FASHION SHOP</a>
        <a class="nav-link text-white" href="/"><i class="bi bi-house"></i> Trang chủ</a>
    </div>
</nav>

<div class="chat-container" id="chatBox">
    <div class="message bot">
        <strong>Trợ lý AI Fashion Shop</strong><br>
        Xin chào! Em có thể tư vấn phối đồ, gợi ý sản phẩm theo phong cách, dịp đi chơi, công sở... Bạn cần hỗ trợ gì ạ?
    </div>
</div>

<div class="chat-input">
    <div class="container">
        <form id="chatForm" class="d-flex gap-2">
            <input type="text" id="messageInput" class="form-control form-control-lg" placeholder="Nhập câu hỏi của bạn..." autocomplete="off" required>
            <button type="submit" class="btn btn-accent btn-lg px-4"><i class="bi bi-send-fill"></i></button>
        </form>
    </div>
</div>

<script>
const chatBox = document.getElementById('chatBox');
const form = document.getElementById('chatForm');
const input = document.getElementById('messageInput');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = input.value.trim();
    if (!msg) return;

    // User message
    chatBox.innerHTML += `<div class="message user">${msg}</div>`;
    input.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    // Bot typing
    const typing = document.createElement('div');
    typing.className = 'message bot';
    typing.id = 'typing';
    typing.innerHTML = '<em>Đang suy nghĩ...</em>';
    chatBox.appendChild(typing);
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        const res = await fetch('/ai/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'message=' + encodeURIComponent(msg)
        });
        const data = await res.json();
        document.getElementById('typing').remove();
        chatBox.innerHTML += `<div class="message bot">${data.answer}</div>`;
    } catch (err) {
        document.getElementById('typing').remove();
        chatBox.innerHTML += `<div class="message bot">Xin lỗi, có lỗi xảy ra. Bạn thử lại nhé!</div>`;
    }
    chatBox.scrollTop = chatBox.scrollHeight;
});
</script>
</body>
</html>
