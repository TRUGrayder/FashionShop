<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --primary: #1a1a2e; }
        body { background: #f0f2f5; font-family: system-ui, -apple-system, sans-serif; }
        .sidebar { background: var(--primary); min-height: 100vh; color: white; }
        .sidebar a { color: rgba(255,255,255,.8); text-decoration: none; display: block; padding: 12px 20px; border-radius: 8px; margin: 4px 12px; }
        .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,.1); color: white; }
        .status-badge { font-size: 0.82rem; padding: 5px 12px; border-radius: 50px; font-weight: 600; }
        .status-PENDING { background: #fff3cd; color: #856404; }
        .status-CONFIRMED { background: #cce5ff; color: #004085; }
        .status-SHIPPING { background: #d4edda; color: #155724; }
        .status-COMPLETED { background: #d1e7dd; color: #0f5132; }
        .status-CANCELLED { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <div class="p-4">
                <h5 class="fw-bold"><i class="bi bi-bag-heart-fill"></i> Admin</h5>
                <small class="text-white-50" th:text="${currentUser.fullName}">Admin</small>
            </div>
            <a href="/admin/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
            <a href="/admin/products"><i class="bi bi-box-seam me-2"></i>Sản phẩm</a>
            <a href="/admin/orders" class="active"><i class="bi bi-receipt me-2"></i>Đơn hàng</a>
            <a href="/logout"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">Quản lý đơn hàng</h3>
                <span class="badge bg-primary fs-6 px-3 py-2 rounded-pill" th:text="${#lists.size(orders)} + ' đơn hàng'">0 đơn</span>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 align-middle">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-3">Mã đơn</th>
                                <th>Khách hàng</th>
                                <th>Số điện thoại</th>
                                <th>Địa chỉ giao</th>
                                <th>Ngày đặt</th>
                                <th>Tổng tiền</th>
                                <th>Trạng thái</th>
                                <th class="text-end pe-3">Cập nhật</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${#lists.isEmpty(orders)}">
                                <td colspan="8" class="text-center py-4 text-muted">Chưa có đơn hàng nào trong hệ thống.</td>
                            </tr>
                            <tr th:each="o : ${orders}">
                                <td class="ps-3 fw-bold">
                                    <a th:href="@{/orders/{id}(id=${o.id})}" target="_blank" class="text-decoration-none" th:text="'#' + ${o.id}">#1</a>
                                </td>
                                <td>
                                    <span class="fw-semibold" th:text="${o.userFullName != null ? o.userFullName : ('User #' + o.userId)}">Khách</span>
                                </td>
                                <td th:text="${o.phone}">0912345678</td>
                                <td>
                                    <small class="text-truncate d-inline-block" style="max-width: 220px;" th:title="${o.shippingAddress}" th:text="${o.shippingAddress}">Địa chỉ</small>
                                </td>
                                <td>
                                    <small th:text="${o.createdAt != null ? #temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm') : ''}">01/01/2026</small>
                                </td>
                                <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</td>
                                <td>
                                    <span class="status-badge" th:classappend="'status-' + ${o.status}" th:text="${o.statusText}">Chờ xử lý</span>
                                </td>
                                <td class="text-end pe-3">
                                    <form method="post" action="/admin/orders/status" class="d-inline-flex align-items-center gap-1">
                                        <input type="hidden" name="orderId" th:value="${o.id}">
                                        <select name="status" class="form-select form-select-sm fw-semibold" style="width: 155px;">
                                            <option value="PENDING" th:selected="${o.status == 'PENDING'}">Chờ xử lý</option>
                                            <option value="CONFIRMED" th:selected="${o.status == 'CONFIRMED'}">Đã xác nhận</option>
                                            <option value="SHIPPING" th:selected="${o.status == 'SHIPPING'}">Đang giao hàng</option>
                                            <option value="COMPLETED" th:selected="${o.status == 'COMPLETED'}">Đã hoàn thành</option>
                                            <option value="CANCELLED" th:selected="${o.status == 'CANCELLED'}">Đã hủy đơn</option>
                                        </select>
                                        <button type="submit" class="btn btn-sm btn-outline-primary" title="Lưu trạng thái">
                                            <i class="bi bi-check-lg"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
