<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --primary: #1a1a2e; }
        body { background: #f0f2f5; }
        .sidebar { background: var(--primary); min-height: 100vh; color: white; }
        .sidebar a { color: rgba(255,255,255,.8); text-decoration: none; display: block; padding: 12px 20px; border-radius: 8px; margin: 4px 12px; }
        .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,.1); color: white; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar p-0">
            <div class="p-4">
                <h5 class="fw-bold"><i class="bi bi-bag-heart-fill"></i> Admin</h5>
            </div>
            <a href="/admin/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
            <a href="/admin/products" class="active"><i class="bi bi-box-seam me-2"></i>Sản phẩm</a>
            <a href="/admin/orders"><i class="bi bi-receipt me-2"></i>Đơn hàng</a>
            <a href="/logout"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a>
        </div>

        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">Quản lý sản phẩm</h3>
                <a href="/admin/products/add" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Thêm sản phẩm
                </a>
            </div>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Hình</th>
                            <th>Tên sản phẩm</th>
                            <th>Danh mục</th>
                            <th>Giá</th>
                            <th>Tồn kho</th>
                            <th class="text-end">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${products}">
                            <td th:text="${p.id}">1</td>
                            <td>
                                <img th:src="${p.image}" width="50" height="50" class="rounded"
                                     style="object-fit:cover"
                                     onerror="this.src='https://via.placeholder.com/50'">
                            </td>
                            <td th:text="${p.name}">Tên</td>
                            <td th:text="${p.categoryName}">DM</td>
                            <td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0</td>
                            <td th:text="${p.quantity}">0</td>
                            <td class="text-end">
                                <a th:href="@{/admin/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/admin/products/delete/{id}(id=${p.id})}"
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Bạn chắc chắn muốn xóa?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
