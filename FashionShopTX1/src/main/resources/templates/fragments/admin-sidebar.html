<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar(activeTab)" class="col-md-2 sidebar p-0">
    <div class="p-4">
        <h5 class="fw-bold mb-1"><i class="bi bi-bag-heart-fill text-danger me-2"></i>Admin</h5>
        <small class="text-white-50" th:text="${currentUser != null ? currentUser.fullName : 'Quản trị viên'}">Quản trị viên</small>
    </div>
    <a href="/admin/dashboard" th:classappend="${activeTab == 'dashboard'} ? 'active' : ''">
        <i class="bi bi-speedometer2"></i>Dashboard
    </a>
    <a href="/admin/products" th:classappend="${activeTab == 'products'} ? 'active' : ''">
        <i class="bi bi-box-seam"></i>Sản phẩm
    </a>
    <a href="/admin/orders" th:classappend="${activeTab == 'orders'} ? 'active' : ''">
        <i class="bi bi-receipt"></i>Đơn hàng
    </a>
    <a href="/logout">
        <i class="bi bi-box-arrow-right"></i>Đăng xuất
    </a>
</div>
</body>
</html>
