<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title=${product.name} + ' - Fashion Shop')}">
</head>
<body>

<!-- Navbar Fragment -->
<div th:replace="~{fragments/navbar :: navbar(activeTab='products')}"></div>

<main class="container my-5">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/" class="text-decoration-none text-muted">Trang chủ</a></li>
            <li class="breadcrumb-item"><a href="/products" class="text-decoration-none text-muted">Sản phẩm</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${product.name}">Tên sản phẩm</li>
        </ol>
    </nav>

    <div class="row g-5 align-items-center">
        <div class="col-md-6">
            <div class="bg-white p-3 rounded-4 shadow-sm text-center border">
                <img th:src="${product.image}" class="img-fluid rounded-4" style="max-height: 480px; object-fit: cover; width: 100%;"
                     th:alt="${product.name}" onerror="this.src='https://via.placeholder.com/600x600?text=Fashion'">
            </div>
        </div>
        <div class="col-md-6">
            <span class="badge bg-secondary mb-2 px-3 py-2 rounded-pill" th:text="${product.categoryName}">Danh mục</span>
            <h1 class="fw-bold mb-3" th:text="${product.name}">Tên sản phẩm</h1>
            <p class="product-price fs-2 my-3" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</p>
            <p class="text-muted leading-relaxed" th:text="${product.description}">Mô tả</p>
            <div class="mb-3">
                <strong>Tình trạng:</strong>
                <span th:if="${product.quantity > 0}" class="badge bg-success-subtle text-success border border-success-subtle ms-1 px-3 py-2 rounded-pill">
                    <i class="bi bi-check-circle me-1"></i>Còn hàng (<span th:text="${product.quantity}">0</span> cái)
                </span>
                <span th:if="${product.quantity <= 0}" class="badge bg-danger-subtle text-danger border border-danger-subtle ms-1 px-3 py-2 rounded-pill">
                    <i class="bi bi-x-circle me-1"></i>Tạm hết hàng
                </span>
            </div>

            <!-- Form thêm vào giỏ hàng -->
            <form method="post" action="/cart/add" class="mt-4">
                <input type="hidden" name="productId" th:value="${product.id}">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <label for="quantity" class="fw-semibold">Số lượng:</label>
                    <input type="number" id="quantity" name="quantity" value="1" min="1"
                           th:max="${product.quantity > 0 ? product.quantity : 1}"
                           class="form-control text-center rounded-3" style="width: 85px;" required>
                </div>
                <div class="d-flex gap-3 flex-wrap">
                    <button type="submit" class="btn btn-accent btn-lg px-4 rounded-pill shadow-sm"
                            th:disabled="${product.quantity <= 0}">
                        <i class="bi bi-cart-plus me-1"></i>
                        <span th:text="${product.quantity > 0 ? 'Thêm vào giỏ hàng' : 'Hết hàng'}">Thêm vào giỏ hàng</span>
                    </button>
                    <a href="/cart" class="btn btn-outline-dark btn-lg px-4 rounded-pill">
                        <i class="bi bi-bag me-1"></i> Xem giỏ hàng
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- Footer Fragment -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
