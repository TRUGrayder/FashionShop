<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Fashion Shop'">Fashion Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a2e;
            --accent: #e94560;
            --light: #f8f9fa;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f5f7; }
        .navbar { background: var(--primary) !important; }
        .navbar-brand { font-weight: 700; letter-spacing: 1px; }
        .nav-link { color: rgba(255,255,255,.85) !important; font-weight: 500; }
        .nav-link:hover, .nav-link.active { color: #fff !important; }
        .btn-accent { background: var(--accent); color: #fff; border: none; }
        .btn-accent:hover { background: #d63651; color: #fff; }
        .card-product { transition: all .25s; border: none; border-radius: 12px; overflow: hidden; }
        .card-product:hover { transform: translateY(-6px); box-shadow: 0 12px 24px rgba(0,0,0,.12); }
        .card-product img { height: 240px; object-fit: cover; }
        .price { color: var(--accent); font-weight: 700; font-size: 1.15rem; }
        .hero {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white; padding: 80px 0; border-radius: 0 0 30px 30px;
        }
        .footer { background: var(--primary); color: rgba(255,255,255,.7); padding: 40px 0; margin-top: 60px; }
        .badge-sale { position: absolute; top: 12px; left: 12px; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-bag-heart-fill me-2"></i>FASHION SHOP
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="/products">Sản phẩm</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" th:if="${currentUser == null}">
                    <a class="nav-link" href="/login"><i class="bi bi-person"></i> Đăng nhập</a>
                </li>
                <li class="nav-item dropdown" th:if="${currentUser != null}">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i>
                        <span th:text="${currentUser.fullName}">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li th:if="${currentUser.role == 'ADMIN'}">
                            <a class="dropdown-item" href="/admin/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
                        </li>
                        <li><a class="dropdown-item" href="/logout"><i class="bi bi-box-arrow-right"></i> Đăng xuất</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Content -->
<div th:fragment="content">
    <!-- Nội dung trang sẽ được thay thế -->
</div>

<!-- Footer -->
<footer class="footer">
    <div class="container text-center">
        <p class="mb-1"><strong>FASHION SHOP</strong> — Website thương mại điện tử tích hợp trợ lý AI</p>
        <p class="mb-0 small">© 2026 Fashion Shop. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
