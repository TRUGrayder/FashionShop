<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Đơn hàng của tôi - Fashion Shop')}">
</head>
<body>

<!-- Navbar Fragment -->
<div th:replace="~{fragments/navbar :: navbar(activeTab='orders')}"></div>

<main class="container my-5">
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div>
            <h2 class="fw-bold mb-1">Đơn hàng của tôi</h2>
            <p class="text-muted mb-0">Theo dõi tiến độ giao hàng và lịch sử mua sắm của bạn</p>
        </div>
        <a href="/products" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
            <i class="bi bi-bag-plus me-1"></i> Mua sắm thêm
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show rounded-3 shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Khi chưa có đơn hàng -->
    <div th:if="${#lists.isEmpty(orders)}" class="text-center py-5 card border-0 shadow-sm p-5 bg-white rounded-4">
        <i class="bi bi-bag-x" style="font-size: 4rem; color: #cbd5e1;"></i>
        <h4 class="mt-3 fw-bold">Bạn chưa có đơn hàng nào</h4>
        <p class="text-muted mb-4">Các đơn hàng bạn đặt sẽ được lưu trữ và hiển thị chi tiết tại đây.</p>
        <div>
            <a href="/products" class="btn btn-accent px-4 py-2 rounded-pill">
                <i class="bi bi-cart me-1"></i> Bắt đầu mua sắm ngay
            </a>
        </div>
    </div>

    <!-- Danh sách đơn hàng -->
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden" th:if="${!#lists.isEmpty(orders)}">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th class="ps-4 py-3">Mã đơn</th>
                    <th class="py-3">Ngày đặt</th>
                    <th class="py-3">Tổng thanh toán</th>
                    <th class="py-3">Trạng thái</th>
                    <th class="pe-4 py-3 text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o : ${orders}">
                    <td class="ps-4 py-3 fw-bold text-primary" th:text="'#' + ${o.id}"></td>
                    <td th:text="${o.createdAt != null ? #temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm') : ''}"></td>
                    <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                    <td>
                        <span class="status-badge" th:classappend="'status-' + ${o.status}" th:text="${o.statusText}"></span>
                    </td>
                    <td class="pe-4 text-end">
                        <a th:href="@{/orders/{id}(id=${o.id})}" class="btn btn-sm btn-outline-primary rounded-pill px-3">
                            <i class="bi bi-eye me-1"></i> Xem chi tiết
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Footer Fragment -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
